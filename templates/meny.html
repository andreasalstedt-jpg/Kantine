{% extends "base.html" %}

{% block title %}Meny{% endblock %}

{% block content %}
    <h1 class="meny-side-tittel">Dagens meny</h1>

    <div class="meny-rad">
        {% for vare in liste %}
        <div class="meny-dag">
            <h2 class="meny-dag-navn">{{ vare.dag }}</h2>
            <div class="meny-kort">
                <img src="{{ vare.bilde }}" alt="{{ vare.navn }}">
                <h3>{{ vare.navn }}</h3>
                <p class="meny-beskrivelse">{{ vare.beskrivelse }}</p>
                <span class="meny-pris">{{ vare.pris }}</span>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
